version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      # The CLI, client and adapter must move together: a client generated by a
      # different CLI version doesn't compile, and the adapter is versioned with both
      prisma:
        patterns:
          - 'prisma'
          - '@prisma/client'
          - '@prisma/adapter-pg'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
