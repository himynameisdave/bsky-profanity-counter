name: Scheduled Application Run

on:
  schedule:
    # Run every 10 minutes
    - cron: '*/10 * * * *'
  # Allow manual triggering of the workflow
  workflow_dispatch:
  # Run when changes are pushed to the repository
  push:
    branches:
      - main

# One run at a time. Overlapping runs fight over the same mentions, and a run
# that hangs shouldn't have more piling up behind it. A new run waits for the
# current one rather than cancelling it partway through replying.
concurrency:
  group: scheduled-run
  cancel-in-progress: false

jobs:
  run-application:
    runs-on: ubuntu-latest
    # The last line of defence. A healthy run takes a few minutes at most, and a
    # stalled feed request times out on its own. Without this, a hang runs until
    # GitHub's 6 hour default. Each mention is saved as it finishes, so a run cut
    # short keeps its progress. The mention it was partway through has already
    # had the attempt counted, and resetStuckMentions puts it back in the queue.
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Build application
        run: pnpm build

      - name: Run application
        run: node dist/index.js
        env:
          NODE_ENV: production
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
