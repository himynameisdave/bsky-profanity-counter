name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/profanity_counter_test

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: profanity_counter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Without DATABASE_URL, like the scheduled workflows, which only hand it to
      # their final step
      - name: Generate Prisma client
        run: env -u DATABASE_URL pnpm prisma:generate

      # db push only syncs the tables; it never regenerates the client
      - name: Prepare integration database
        run: pnpm db:push

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      # The suites that write to Postgres, one file at a time, since one of them
      # checks a total over the whole table the others add to
      - name: Run database tests
        run: pnpm test:db
        env:
          PROFILE_TOTAL_DATABASE_TESTS: '1'
          MENTION_IDENTITY_DATABASE_TESTS: '1'
          NOTIFICATION_SCAN_DATABASE_TESTS: '1'
          PRISMA_ADAPTER_DATABASE_TESTS: '1'

      # Test files share workers, so this runs them all in one worker, shuffled with a fixed
      # seed, to catch state leaking from one file into the next. A single worker also keeps
      # the suites that write to the database out of each other's totals.
      - name: Run tests in shuffled file order
        run: pnpm test:order
        env:
          PROFILE_TOTAL_DATABASE_TESTS: '1'
          MENTION_IDENTITY_DATABASE_TESTS: '1'

      # Production compiles with tsconfig.build.json, which typecheck doesn't exercise
      - name: Build
        run: pnpm build

      # The compiled client, in plain Node rather than Vitest. It exits on its own
      # once the pool is closed, so a leaked connection fails here as a timeout.
      - name: Smoke-test the compiled database client
        run: pnpm smoke:db
        timeout-minutes: 2
